site_name: Compiladores UnB
site_description: Documentação do compilador desenvolvido para a disciplina de Compiladores (UnB)
site_url: https://pedrolrm.github.io/compiladores-unb/
repo_url: https://github.com/pedrolrm/compiladores-unb
repo_name: pedrolrm/compiladores-unb

theme:
  name: material
  language: pt-BR
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Mudar para modo escuro
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Mudar para modo claro
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
  - Início: index.md
  - Especificação Léxica: tokens.md
  - Gramática Livre de Contexto (GLC): gramatica.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - tables
  - attr_list
